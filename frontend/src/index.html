<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Angular dev server may use eval(); strict CSP (browser/extension) blocks it and breaks the app.
    This policy allows local dev on localhost. For a public production site, tighten script-src (drop unsafe-eval).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* wss://localhost:* wss://127.0.0.1:* http://*.elb.amazonaws.com https://*.elb.amazonaws.com;">
  <title>Frontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
