<div class="layout">
  <header class="topbar">
    <div class="brand" routerLink="/dashboard">
      <div class="logo">❄</div>
      <div>
        <div class="title">Cold Chain Monitor</div>
        <div class="subtitle">IoT Logistics</div>
      </div>
    </div>
    <nav class="nav">
      @if (auth.isLoggedIn()) {
        <span class="role-pill">{{ auth.roleLabel() }}</span>
      }
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <button class="linklike" type="button" (click)="logout()">Logout</button>
    </nav>
  </header>

  <main class="container">
    <router-outlet />
  </main>
</div>
