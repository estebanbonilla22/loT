services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: coldchain
      POSTGRES_USER: coldchain
      POSTGRES_PASSWORD: coldchain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: coldchain
      DB_USER: coldchain
      DB_PASSWORD: coldchain
      APP_JWT_SECRET: "change-me-change-me-change-me-change-me-change-me-change-me"
      APP_JWT_ISSUER: "coldchain-api"
      APP_JWT_EXPIRATION_SECONDS: 86400
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:

